<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dettaglio Prodotto</title>
<link id="fontLink" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f; --surface: #16161a; --surface2: #1e1e24;
    --border: #2a2a35; --accent: #7b61ff; --accent-dim: rgba(123,97,255,0.15);
    --text: #e8e8f0; --muted: #6b6b80;
    --sans: 'Syne', sans-serif; --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,13,15,0.9); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-logo { width: 36px; height: 36px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .nav-name { font-size: 17px; font-weight: 800; color: var(--text); }
  .nav-actions { display: flex; align-items: center; gap: 12px; }
  .nav-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 8px 16px; border-radius: 6px; cursor: pointer;
    font-family: var(--sans); font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px; text-decoration: none;
    transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cart-count { background: var(--accent); color: white; font-size: 11px; font-weight: 700;
    width: 20px; height: 20px; border-radius: 50%; display: none; align-items: center; justify-content: center; }

  .back-bar {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .back-link {
    display: flex; align-items: center; gap: 8px; color: var(--muted);
    font-family: var(--mono); font-size: 12px; text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--accent); }
  .breadcrumb { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .breadcrumb span { color: var(--text); }

  .product-layout {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 48px; max-width: 1100px; margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* IMAGE SIDE */
  .img-side {}
  .img-main {
    border-radius: 16px; overflow: hidden; background: var(--surface);
    border: 1px solid var(--border); aspect-ratio: 4/3; position: relative;
  }
  .img-main img { width: 100%; height: 100%; object-fit: cover; }
  .img-main .zoom-hint {
    position: absolute; bottom: 12px; right: 12px;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    color: var(--muted); font-family: var(--mono); font-size: 10px;
    padding: 4px 10px; border-radius: 4px;
  }
  .img-thumbs { display: flex; gap: 8px; margin-top: 12px; }
  .img-thumb {
    width: 72px; height: 54px; border-radius: 8px; overflow: hidden;
    border: 2px solid var(--border); cursor: pointer; flex-shrink: 0;
    transition: border-color 0.15s;
  }
  .img-thumb.active { border-color: var(--accent); }
  .img-thumb img { width: 100%; height: 100%; object-fit: cover; }

  /* INFO SIDE */
  .info-side {}
  .product-badge { display: inline-block; font-family: var(--mono); font-size: 11px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--accent);
    margin-bottom: 12px; }
  .product-brand { font-size: 13px; color: var(--muted); font-family: var(--mono); margin-bottom: 8px; }
  h1 { font-size: clamp(24px, 3vw, 36px); font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin-bottom: 16px; }
  .product-price { font-size: 40px; font-weight: 800; letter-spacing: -2px; margin-bottom: 24px; }
  .currency-label { font-family: var(--mono); font-size: 18px; color: var(--muted); font-weight: 300; }

  .product-desc {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 24px; line-height: 1.7; font-size: 15px; color: var(--muted);
  }
  .product-desc strong { color: var(--text); font-weight: 600; }

  .specs-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    margin-bottom: 28px;
  }
  .spec-item {
    background: var(--surface); padding: 14px 16px;
  }
  .spec-label { font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }
  .spec-value { font-size: 14px; font-weight: 600; }

  .qty-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .qty-label { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .qty-ctrl {
    display: flex; align-items: center; gap: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .qty-btn {
    width: 36px; height: 36px; background: transparent; border: none; color: var(--text);
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .qty-btn:hover { background: var(--accent-dim); }
  .qty-num {
    width: 44px; text-align: center; font-family: var(--mono); font-size: 16px; font-weight: 500;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    padding: 8px 0;
  }

  .action-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-add {
    flex: 1; min-width: 160px; background: var(--accent); color: white;
    border: none; border-radius: 10px; padding: 16px 24px;
    font-family: var(--sans); font-size: 16px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center;
    justify-content: center; gap: 8px;
  }
  .btn-add:hover { background: #6a52e0; transform: translateY(-1px); }
  .btn-add:active { transform: scale(0.98); }

  .btn-wishlist {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 16px 20px; border-radius: 10px;
    cursor: pointer; font-size: 20px; transition: all 0.2s;
  }
  .btn-wishlist:hover { border-color: var(--accent); }

  .trust-row {
    display: flex; gap: 16px; margin-top: 24px; flex-wrap: wrap;
  }
  .trust-item {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 200;
    background: var(--accent); color: white; padding: 12px 20px;
    border-radius: 8px; font-size: 14px; font-weight: 600;
    transform: translateY(80px); opacity: 0; transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  @media (max-width: 768px) {
    .product-layout { grid-template-columns: 1fr; gap: 32px; padding: 24px 16px 60px; }
    .specs-grid { grid-template-columns: 1fr; }
    nav { padding: 0 12px; }
  }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">
    <div class="nav-logo" id="navLogo">🛍</div>
    <div class="nav-name" id="navName">Catalogo</div>
  </a>
  <div class="nav-actions">
    <a class="nav-btn" href="cart.html">
      🛒 Carrello
      <span class="cart-count" id="cartCount"></span>
    </a>
  </div>
</nav>

<div class="back-bar">
  <a class="back-link" href="index.html">← Torna al catalogo</a>
  <div class="breadcrumb" id="breadcrumb">/ <span id="breadProduct">—</span></div>
</div>

<div class="product-layout">
  <div class="img-side">
    <div class="img-main">
      <img id="mainImg" src="" alt="">
      <div class="zoom-hint">immagine prodotto</div>
    </div>
    <div class="img-thumbs" id="thumbs"></div>
  </div>

  <div class="info-side">
    <div class="product-badge" id="pBadge"></div>
    <div class="product-brand" id="pBrand"></div>
    <h1 id="pModel">—</h1>
    <div class="product-price" id="pPrice">—</div>

    <div class="product-desc" id="pDesc">—</div>

    <div class="specs-grid" id="specsGrid"></div>

    <div class="qty-row">
      <span class="qty-label">Quantità</span>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <div class="qty-num" id="qtyNum">1</div>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>

    <div class="action-row">
      <button class="btn-add" onclick="addToCart()">🛒 Aggiungi al carrello</button>
      <button class="btn-wishlist" onclick="this.textContent=this.textContent==='♡'?'♥':'♡'">♡</button>
    </div>

    <div class="trust-row">
      <div class="trust-item">🚚 Spedizione gratuita</div>
      <div class="trust-item">↩ Reso 30 giorni</div>
      <div class="trust-item">🔒 Pagamento sicuro</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_CSV = `marca,modello,descrizione,immagine,prezzo
Apple,MacBook Pro 16",Laptop professionale con chip M3 Pro, display Liquid Retina XDR 16 pollici, 18GB RAM, 512GB SSD. Autonomia fino a 22 ore. Ideale per professionisti creativi e sviluppatori.,https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=600,2499.00
Apple,iPhone 15 Pro,Smartphone flagship con chip A17 Pro, sistema a tripla fotocamera con zoom ottico 5x, titanio di grado aerospaziale, Dynamic Island e USB-C. Display Super Retina XDR 6.1 pollici.,https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=600,1299.00
Samsung,Galaxy S24 Ultra,Smartphone Android top di gamma con S Pen integrata, fotocamera da 200MP, display Dynamic AMOLED 2X 6.8 pollici, chip Snapdragon 8 Gen 3, 12GB RAM e 256GB storage.,https://images.unsplash.com/photo-1610945415295-d9bbf067e59c?w=600,1399.00
Sony,WH-1000XM5,Cuffie over-ear wireless con cancellazione del rumore leader del settore, 30 ore di autonomia, ricarica rapida, audio Hi-Res certificato e microfono array per chiamate cristalline.,https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=600,349.00
Dell,XPS 15,Laptop premium con display OLED 15.6 pollici 3.5K touch, Intel Core i7-13700H, 16GB RAM, RTX 4060, chassis in alluminio e fibra di carbonio. Perfetto per creativi e professionisti.,https://images.unsplash.com/photo-1593642632559-0c6d3fc62b89?w=600,1799.00
Bose,QuietComfort 45,Cuffie wireless premium con cancellazione attiva del rumore, suono Bose bilanciato e naturale, 24 ore di autonomia, cuscinetti in memory foam e archetto regolabile ultraleggero.,https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600,279.00
Apple,iPad Pro 12.9",Tablet professionale con chip M2, display Liquid Retina XDR mini-LED, connettività 5G, compatibile con Apple Pencil 2 e Magic Keyboard. Lo strumento definitivo per la creatività mobile.,https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=600,1099.00
Logitech,MX Master 3S,Mouse wireless ergonomico con sensore da 8000 DPI silenzioso, scroll MagSpeed elettromagnetico, connessione multi-dispositivo Bolt e Bluetooth, ricarica USB-C e autonomia da 70 giorni.,https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=600,99.00`;

let qty = 1;
let product = null;
let cfg = {};

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
  const products = [];
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i]; if (!line.trim()) continue;
    const values = []; let cur = '', inQ = false;
    for (let c of line) {
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { values.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    values.push(cur.trim());
    const obj = {}; headers.forEach((h, idx) => obj[h] = values[idx] || '');
    products.push(obj);
  }
  return products;
}

function applyTheme(c) {
  if (!c.themeColors) return;
  const r = document.documentElement.style; const t = c.themeColors;
  if (t.bg) r.setProperty('--bg', t.bg);
  if (t.surface) r.setProperty('--surface', t.surface);
  if (t.text) r.setProperty('--text', t.text);
  if (t.muted) r.setProperty('--muted', t.muted);
  if (c.accentColor) { r.setProperty('--accent', c.accentColor); r.setProperty('--accent-dim', c.accentColor + '26'); }
  if (c.fontFamily) {
    r.setProperty('--sans', `'${c.fontFamily}', sans-serif`);
    document.getElementById('fontLink').href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(c.fontFamily)}:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap`;
  }
}

function init() {
  const raw = localStorage.getItem('shopConfig');
  cfg = raw ? JSON.parse(raw) : {};
  applyTheme(cfg);

  document.getElementById('navName').textContent = cfg.shopName || 'Catalogo';
  document.title = 'Prodotto — ' + (cfg.shopName || 'Catalogo');

  const brandCol = cfg.colBrand || 'marca';
  const modelCol = cfg.colModel || 'modello';

  let csvText = cfg.csvData;
  if (!csvText || csvText === '__USE_DEFAULT__') csvText = DEFAULT_CSV;
  const products = parseCSV(csvText);

  const idx = parseInt(localStorage.getItem('currentProduct') || '0');
  product = products[idx] || products[0];
  if (!product) { window.location.href = 'index.html'; return; }

  const brand = product[brandCol] || product.marca || '';
  const model = product[modelCol] || product.modello || '';
  const desc = product.descrizione || '';
  const img = product.immagine || '';
  const price = parseFloat(product.prezzo || 0).toFixed(2);
  const cur = cfg.currency || '€';

  document.getElementById('breadProduct').textContent = `${brand} ${model}`;
  document.getElementById('pBadge').textContent = brand;
  document.getElementById('pBrand').textContent = brand;
  document.getElementById('pModel').textContent = model;
  document.getElementById('pPrice').innerHTML = `${cur}${price}<span class="currency-label"></span>`;
  document.getElementById('pDesc').innerHTML = desc;
  document.getElementById('mainImg').src = img;
  document.getElementById('mainImg').alt = model;
  document.title = `${model} — ${cfg.shopName || 'Catalogo'}`;

  // Thumbs (same image x3 as placeholder)
  const thumbs = document.getElementById('thumbs');
  [img, img, img].forEach((src, i) => {
    const div = document.createElement('div');
    div.className = 'img-thumb' + (i === 0 ? ' active' : '');
    div.innerHTML = `<img src="${src}" alt="">`;
    div.onclick = () => {
      document.querySelectorAll('.img-thumb').forEach(t => t.classList.remove('active'));
      div.classList.add('active');
      document.getElementById('mainImg').src = src;
    };
    thumbs.appendChild(div);
  });

  // Specs from all CSV fields except known ones
  const known = ['marca','modello','descrizione','immagine','prezzo', brandCol, modelCol];
  const extraFields = Object.keys(product).filter(k => !known.includes(k) && product[k]);
  const specItems = [
    { label: 'Marca', value: brand },
    { label: 'Modello', value: model },
    { label: 'Prezzo', value: `${cur}${price}` },
  ];
  extraFields.forEach(k => specItems.push({ label: k.charAt(0).toUpperCase() + k.slice(1), value: product[k] }));

  document.getElementById('specsGrid').innerHTML = specItems.map(s =>
    `<div class="spec-item"><div class="spec-label">${s.label}</div><div class="spec-value">${s.value}</div></div>`
  ).join('');

  updateCartCount();
}

function changeQty(delta) {
  qty = Math.max(1, qty + delta);
  document.getElementById('qtyNum').textContent = qty;
}

function addToCart() {
  const brandCol = cfg.colBrand || 'marca';
  const modelCol = cfg.colModel || 'modello';
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  const idx = parseInt(localStorage.getItem('currentProduct') || '0');
  const existing = cart.find(item => item.idx === idx);
  if (existing) existing.qty += qty;
  else cart.push({
    idx,
    brand: product[brandCol] || product.marca,
    model: product[modelCol] || product.modello,
    price: parseFloat(product.prezzo),
    img: product.immagine,
    qty
  });
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartCount();
  showToast(`✓ ${qty}× ${product[modelCol] || product.modello} aggiunto!`);
}

function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem('cart') || '[]');
  const total = cart.reduce((s, i) => s + i.qty, 0);
  const el = document.getElementById('cartCount');
  if (total > 0) { el.style.display = 'flex'; el.textContent = total; }
  else el.style.display = 'none';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
