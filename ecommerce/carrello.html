<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Tuo Carrello</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="shop-branding">
                <h1 id="dyn-shop-name">Il Mio Negozio</h1>
                <p id="dyn-shop-cat">Categoria</p>
            </div>
            <nav>
                <a href="index.html">Catalogo</a>
                <a href="carrello.html">Carrello</a>
            </nav>
        </div>
    </header>

    <main>
        <h2>Il Tuo Carrello</h2>
        <div class="cart-layout">
            <section id="cart-items" class="cart-items-list">
                </section>
            
            <aside class="cart-summary-box">
                <h3>Riepilogo Ordine</h3>
                <hr style="margin: 1rem 0; border: 0; border-top: 1px solid var(--border);">
                <div class="summary-row">
                    <span>Totale:</span>
                    <span id="cart-total" style="font-weight: 700; color: var(--primary);">€ 0.00</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem;">
                    <button id="btn-pdf" class="btn">Genera Ricevuta PDF</button>
                    <button id="btn-clear" class="btn btn-secondary btn-danger">Svuota Carrello</button>
                </div>
            </aside>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Front-End Mini WebApp E-commerce.</p>
    </footer>

    <div id="toast-container"></div>
    <script src="js/app.js"></script>
</body>
</html>
